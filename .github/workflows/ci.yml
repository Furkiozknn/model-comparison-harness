name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject'teki siniflandiricilarin vaat ettigi her surum.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -v

      # README'deki "Quick start" komutlari, yazildigi gibi. Testler ic
      # fonksiyonlari cagiriyor; bu adim kurulan `mch` komutunun kendisini.
      - name: README quick start
        run: |
          set -eu
          uv run mch validate examples/compare-mocks.yaml
          uv run mch validate examples/compare-with-gateway.yaml
          out="$(uv run mch run examples/compare-mocks.yaml --input '{"prompt": "a cat riding a bike"}')"
          echo "$out"
          echo "$out" | grep -q '^fastest successful backend: fast-mock '
          echo "$out" | grep -q '^2 succeeded, 1 failed$'
          if uv run mch run examples/compare-mocks.yaml --input '{}' --fail-on-error >/dev/null; then
            echo "::error::--fail-on-error sifirla cikti"; exit 1
          fi

  package:
    # yayinla.yml paketi yalniz etiket gelince kuruyor; bozuk bir paket
    # (eksik modul, twine'in reddettigi metadata, calismayan `mch` giris
    # noktasi) etiketten ONCE burada gorunsun.
    name: paket (build + twine check + temiz kurulum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build
        run: uv build

      - name: twine check
        run: uvx twine check --strict dist/*

      - name: Wheel'i bos bir ortama kur ve calistir
        run: |
          set -eu
          uv venv /tmp/temiz
          uv pip install --python /tmp/temiz/bin/python dist/*.whl
          cd /tmp
          /tmp/temiz/bin/mch validate "$GITHUB_WORKSPACE/examples/compare-mocks.yaml"
          /tmp/temiz/bin/mch run "$GITHUB_WORKSPACE/examples/compare-mocks.yaml" --input '{"prompt": "x"}' | grep -q '^2 succeeded, 1 failed$'
          # __init__.__version__ elle yaziliyor; pyproject ile ayrismasin.
          /tmp/temiz/bin/python -c "import tomllib, model_comparison_harness as m; v = tomllib.load(open('$GITHUB_WORKSPACE/pyproject.toml', 'rb'))['project']['version']; assert m.__version__ == v, (m.__version__, v); print('surum', v)"

  vendor:
    name: gateway_poll.py kaynagiyla ayni mi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Bu dosya ai-job-gateway'den kopyalandi. Kopyalamak bilincli bir karar:
      # dort projeden hicbiri digerine bagimli olmak zorunda kalmiyor. Ama
      # kopyalar sessizce ayrisir -- birinde duzeltilen bir sinir durumu
      # digerlerinde durmaya devam eder ve her depo kendi kopyasina karsi
      # yesil kalir. Betik ag yoksa ATLIYOR, gecmiyor (cikis 2).
      - name: Kanonik kopyayla karsilastir
        run: |
          set -eu
          kod=0
          python3 arac/vendor-dogrula.py || kod=$?
          case "$kod" in
            0) echo "ayni" ;;
            2) echo "::warning::kanonik kopyaya bakilamadi; bu adim bir sey kanitlamadi" ;;
            *) exit "$kod" ;;
          esac
