[project]
name = "model-comparison-harness"
version = "0.1.0"
description = "Run the same request against multiple generative-model backends concurrently and compare latency, success, and results side by side."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Furkiozkann" },
]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Optional: model-graded ("llm-rubric" style) scoring via a judge model.
# Not a base dependency - litellm pulls in a large tree (openai/anthropic/
# tiktoken/...) that most comparisons (mock/gateway/http backends without
# --rubric) never need. Enable with `uv sync --extra grading`.
grading = [
    "litellm>=1.97.0",
]

[project.scripts]
mch = "model_comparison_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_comparison_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
